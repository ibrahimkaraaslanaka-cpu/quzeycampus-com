<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Paneli - Quzeycampus</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { padding: 20px; font-family: sans-serif; background: #f8fafc; }
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        h1 { margin-bottom: 24px; color: #1e293b; font-size: 24px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border-bottom: 1px solid #e2e8f0; padding: 12px; text-align: left; }
        th { background-color: #f1f5f9; color: #475569; font-weight: 600; }
        .actions { margin-bottom: 20px; display: flex; gap: 12px; }
        .btn { padding: 8px 16px; background: #2563eb; color: #fff; text-decoration: none; border-radius: 6px; cursor: pointer; border: none; font-size: 14px; font-weight: 500; transition: background 0.2s; }
        .btn:hover { background: #1d4ed8; }
        .btn-export { background: #10b981; }
        .btn-export:hover { background: #059669; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Başvuru Yönetimi</h1>
        <div class="actions">
            <button class="btn" onclick="fetchSubmissions()">Yenile</button>
            <a href="/api/export" class="btn btn-export">CSV Olarak Dışa Aktar</a>
        </div>
        <table id="submissionsTable">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Tür</th>
                    <th>Ad Soyad</th>
                    <th>E-posta</th>
                    <th>Tarih</th>
                    <th>Detaylar</th>
                </tr>
            </thead>
            <tbody id="submissionsBody">
                <!-- Data will be loaded here -->
            </tbody>
        </table>
    </div>

    <script>
        async function fetchSubmissions() {
            try {
                const response = await fetch('/api/submissions');
                const data = await response.json();
                const body = document.getElementById('submissionsBody');
                body.innerHTML = '';
                data.forEach(s => {
                    const row = `<tr>
                        <td>${s.id}</td>
                        <td>${s.type}</td>
                        <td>${s.name}</td>
                        <td>${s.email}</td>
                        <td>${s.date}</td>
                        <td>${s.details || ''}</td>
                    </tr>`;
                    body.innerHTML += row;
                });
            } catch (error) {
                console.error('Error fetching submissions:', error);
            }
        }
        window.onload = fetchSubmissions;
    </script>
</body>
</html>
